variant: v3_moe_mla_dsa
use_moe: true
use_mla: true
use_dsa: true
use_recurrent: false
n_experts: 8
n_active: 2
n_shared_experts: 1
router_aux_loss_coef: 0.01
index_n_heads: 4
index_head_dim: 32
dsa_local_window: 16
tie_weights: true
dropout: 0.0
bias: false
notes: V2 plus a lightweight DSA indexer (top-k + local window).

scales:
  smoke:
    n_layer: 4
    n_embd: 256
    n_head: 4
    block_size: 256
    kv_lora_rank: 32
    qk_rope_head_dim: 16
    index_topk: 32
  local_16gb:
    n_layer: 8
    n_embd: 384
    n_head: 6
    block_size: 512
    kv_lora_rank: 32
    qk_rope_head_dim: 16
    # Keep ~1/8 of context selected (same rule as smoke/full).
    index_topk: 64
  local_16gb_w768:
    # Opt-in ~100M-active width scale-up; same MLA/DSA lab knobs as local_16gb.
    n_layer: 8
    n_embd: 768
    n_head: 12
    block_size: 512
    n_inner: 3200
    kv_lora_rank: 32
    qk_rope_head_dim: 16
    index_topk: 64
  full:
    n_layer: 12
    n_embd: 768
    n_head: 12
    block_size: 1024
    kv_lora_rank: 64
    qk_rope_head_dim: 32
    index_topk: 128
