variant: v0_dense
use_moe: false
use_mla: false
use_dsa: false
use_recurrent: false
tie_weights: true
dropout: 0.0
bias: false
notes: Dense decoder-only Transformer baseline.

scales:
  smoke:
    n_layer: 4
    n_embd: 256
    n_head: 4
    block_size: 256
  full:
    n_layer: 12
    n_embd: 768
    n_head: 12
    block_size: 1024
    # Shrink FFN vs default 4*n_embd so full-scale active params match V2–V4 (±2%).
    # Prefer shrinking V0/V1 over widening MLA so the KV-compression comparison stays clean.
    n_inner: 2832
