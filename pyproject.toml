[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmarcheval"
version = "0.1.0"
description = "Frontier-SLM lab: dense, MoE, MLA, DSA, and recurrent-depth variants at small scale."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LLMarchEval" }]
dependencies = [
    "torch>=2.2",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
dev = ["pytest>=8.0"]

[project.scripts]
llme-train = "llmarcheval.cli.train:main"
llme-eval = "llmarcheval.cli.eval_cli:main"
llme-estimate = "llmarcheval.cli.estimate:main"
llme-experiment = "llmarcheval.cli.experiment:main"
llme-campaign = "llmarcheval.cli.campaign:main"
llme-eval-ckpt = "llmarcheval.cli.eval_protocol:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
